<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- Transparent background with ~10% margin (safe box 14..114) -->
  <!-- Pixel-art isometric office building badge -->
  <rect x="20" y="24" width="88" height="84" fill="#1e293b"/>
  <rect x="24" y="28" width="80" height="76" fill="#334155"/>
  <!-- Roof accent -->
  <rect x="16" y="20" width="96" height="8" fill="#38bdf8"/>
  <rect x="24" y="14" width="80" height="6" fill="#0284c7"/>
  <!-- Rooftop antenna / beacon -->
  <rect x="62" y="10" width="4" height="4" fill="#facc15"/>
  <!-- Office windows (2x2 lit rooms) -->
  <!-- Top-left room -->
  <rect x="30" y="34" width="30" height="24" fill="#0f172a"/>
  <rect x="32" y="36" width="26" height="20" fill="#1e3a8a"/>
  <rect x="36" y="42" width="10" height="8" fill="#38bdf8"/>
  <!-- Top-right room (warm light) -->
  <rect x="68" y="34" width="30" height="24" fill="#0f172a"/>
  <rect x="70" y="36" width="26" height="20" fill="#78350f"/>
  <rect x="74" y="42" width="10" height="8" fill="#fde047"/>
  <!-- Bottom-left room -->
  <rect x="30" y="64" width="30" height="24" fill="#0f172a"/>
  <rect x="32" y="66" width="26" height="20" fill="#14532d"/>
  <rect x="44" y="72" width="10" height="8" fill="#4ade80"/>
  <!-- Bottom-right room (Gemini studio) -->
  <rect x="68" y="64" width="30" height="24" fill="#0f172a"/>
  <rect x="70" y="66" width="26" height="20" fill="#312e81"/>
  <rect x="78" y="70" width="8" height="8" fill="#c084fc"/>
  <!-- Pixel avatars inside rooms -->
  <!-- Avatar 1 (top-left) -->
  <rect x="48" y="40" width="6" height="6" fill="#fed7aa"/>
  <rect x="48" y="38" width="6" height="2" fill="#f97316"/>
  <rect x="46" y="46" width="10" height="8" fill="#22d3ee"/>
  <!-- Avatar 2 (top-right, raising hand!) -->
  <rect x="86" y="40" width="6" height="6" fill="#fed7aa"/>
  <rect x="86" y="38" width="6" height="2" fill="#eab308"/>
  <rect x="84" y="46" width="10" height="8" fill="#f43f5e"/>
  <rect x="94" y="40" width="2" height="8" fill="#fed7aa"/>
  <!-- Ground floor entrance -->
  <rect x="52" y="92" width="24" height="12" fill="#0f172a"/>
  <rect x="56" y="94" width="16" height="10" fill="#38bdf8"/>
  <!-- Base border -->
  <rect x="16" y="104" width="96" height="6" fill="#0f172a"/>
</svg>
